name: Check prototype

on:
  push:
  pull_request:

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/engine.js
          node --check src/main.js
      - name: Unit tests
        run: npm test
      - name: Required assets
        run: |
          test -s index.html
          test -s src/style.css
          test -s assets/atlas.webp
